services:
  api-gateway:
    image: nginx:alpine
    container_name: quickbite-api-gateway
    ports:
      - "${GATEWAY_PORT:-8083}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      order-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-network

  order-service:
    image: ${ORDER_SERVICE_IMAGE:?Set ORDER_SERVICE_IMAGE in .env}
    pull_policy: missing
    container_name: quickbite-order-service
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/${POSTGRES_DB:-quickbite_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quickbite}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      order-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-network

  order-db:
    image: postgres:15
    container_name: quickbite-order-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickbite_db}
      POSTGRES_USER: ${POSTGRES_USER:-quickbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - quickbite-network

volumes:
  order_db_data:

networks:
  quickbite-network:
    driver: bridge
